version: '3.8'

services:
  mysql-container:
    image: mysql:8
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: loginappdb
      MYSQL_USER: loginuser
      MYSQL_PASSWORD: loginpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  loginapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: loginapp
    container_name: loginapp
    ports:
      - "8088:8088"
    depends_on:
      - mysql-container
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-container:3306/loginappdb
      SPRING_DATASOURCE_USERNAME: loginuser
      SPRING_DATASOURCE_PASSWORD: loginpassword
    restart: on-failure

volumes:
  mysql_data:
