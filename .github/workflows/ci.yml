name: Build and Test Java Project with Maven

on:
  push:
    branches:
      - develop  # Trigger on push to the develop branch
  pull_request:
    branches:
      - develop  # Trigger on PR targeting the develop branch

jobs:
  build:
    runs-on: ubuntu-latest  # Define the environment

    steps:
    # Checkout code from the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Set up JDK 17 (or your Java version)
    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'

    # Cache Maven dependencies for faster builds
    - name: Cache Maven dependencies
      uses: actions/cache@v2
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # Build the application with Maven
    - name: Build with Maven
      run: ./mvnw clean install -DskipTests=false

    # Run the unit tests
    - name: Run Tests
      run: ./mvnw test
