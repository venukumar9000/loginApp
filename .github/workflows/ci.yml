name: Build Java Project with Docker DB and Maven (Skip Tests)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:20.10.16-dind
        options: --privileged

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Start MySQL via docker-compose
      run: |
        docker-compose up -d
        docker ps

    - name: Wait for DB to be ready
      run: |
        echo "Waiting for MySQL to be ready..."
        sleep 20  # adjust if needed
        docker logs $(docker ps -q --filter "ancestor=mysql") || true

    - name: Give execute permission to mvnw
      run: chmod +x mvnw

    - name: Build with Maven (Skip Tests)
      run: ./mvnw clean install -DskipTests
