name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up SSH keys
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}  # Make sure you set EC2_SSH_KEY in GitHub Secrets

      # Step 3: Clone repository (if not already done)
      - name: Clone repository on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
            if [ ! -d "~/loginApp" ]; then
              git clone https://github.com/venukumar9000/loginApp ~/loginApp
            fi
            cd ~/loginApp
            git pull origin main
          EOF

      # Step 4: Run Docker commands on EC2
      - name: Deploy application using Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
            cd ~/loginApp
            docker-compose down
            docker-compose up --build -d
          EOF
